name: Windows Build

on:
  push:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

env:
  MSYS2_DIR: C:\msys64

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSYS2 with MinGW64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk2
            mingw-w64-x86_64-make
            mingw-w64-x86_64-perl
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-vala
          pacboy: >-
            cmake:p
            ninja:p

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Configure with CMake
        shell: msys2 {0}
        run: cmake -B build -S . -G Ninja

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Install
        run: |
          $env:PATH = "$env:MSYS2_DIR\mingw64\bin;$env:PATH"
          mingw32-make.exe -C "${{ github.workspace }}\build" install

      - name: Assemble release directory
        run: |
          $builddir   = "${{ github.workspace }}\build"
          $releasedir = "${{ github.workspace }}\release"
          $msys2dir   = $env:MSYS2_DIR

          New-Item -Path $releasedir -ItemType Directory | Out-Null

          # Copy CF data files
          Copy-Item -Path "$builddir\share" -Destination $releasedir -Recurse

          # Copy GTK runtime files from MinGW
          New-Item -Path "$releasedir\lib" -ItemType Directory | Out-Null
          Copy-Item -Path "$msys2dir\mingw64\lib\gtk-2.0"        -Destination "$releasedir\lib"   -Recurse
          Copy-Item -Path "$msys2dir\mingw64\lib\gdk-pixbuf-2.0" -Destination "$releasedir\lib"   -Recurse
          Copy-Item -Path "$msys2dir\mingw64\share\themes"        -Destination "$releasedir\share" -Recurse

          # Copy the compiled binary
          Copy-Item "$builddir\bin\crossfire-client-gtk2.exe" $releasedir

          # Use ldd to collect required MinGW DLLs. The output format is:
          #   libname.dll => /mingw64/bin/libname.dll (0x...)
          # so split on space and take field [2] to get the Unix-style path,
          # then regex-extract just the filename portion after /mingw64/bin/.
          $dlls = & "$env:MSYS2_DIR\usr\bin\ldd.exe" "$releasedir\crossfire-client-gtk2.exe" |
            ForEach-Object { $_.Split(' ')[2] } |
            Select-String -Pattern '(?<=\/mingw64\/bin\/).*' |
            ForEach-Object { $_.Matches.Value }

          if (-not $dlls) { throw "ldd returned no MinGW DLLs; check that ldd is working correctly." }
          $dlls | ForEach-Object { Copy-Item "$msys2dir\mingw64\bin\$_" $releasedir }

          # SDL loads ogg/vorbis DLLs lazily, so ldd misses them — copy manually
          Copy-Item "$msys2dir\mingw64\bin\libvorbis-0.dll"     $releasedir
          Copy-Item "$msys2dir\mingw64\bin\libvorbisfile-3.dll" $releasedir
          Copy-Item "$msys2dir\mingw64\bin\libogg-0.dll"         $releasedir

      - name: Get version info
        id: version
        run: |
          $gitver = (git rev-parse --short HEAD)
          $version = (Get-Content "${{ github.workspace }}\CMakeLists.txt" |
            Select-String -Pattern '(?<=set\(VERSION ).*(?=\))' |
            ForEach-Object { $_.Matches.Value })
          echo "gitver=$gitver"     >> $env:GITHUB_OUTPUT
          echo "version=$version"   >> $env:GITHUB_OUTPUT
          echo "nsisversion=$version.0" >> $env:GITHUB_OUTPUT

      - name: Create zip archive
        run: |
          $releasedir  = "${{ github.workspace }}\release"
          $packagedir  = "${{ github.workspace }}\package"
          $gitver      = "${{ steps.version.outputs.gitver }}"

          New-Item -Path $packagedir -ItemType Directory | Out-Null

          $zipfile = "$packagedir\crossfire-client-git-$gitver-win32_amd64.zip"
          # -mmt1: single-threaded compression to keep memory usage predictable on CI runners
          7z a -mx9 -mmt1 -r -- $zipfile $releasedir
          if ($LASTEXITCODE -ne 0) { throw "7-zip failed with exit code $LASTEXITCODE" }

          pushd $packagedir
          & "$env:MSYS2_DIR\usr\bin\sha256sum.exe" "crossfire-client-git-$gitver-win32_amd64.zip" `
            > "$packagedir\crossfire-client-git-$gitver-win32_amd64.sha256"
          popd

      - name: Build NSIS installer
        run: |
          $releasedir   = "${{ github.workspace }}\release"
          $packagedir   = "${{ github.workspace }}\package"
          $sourcedir    = "${{ github.workspace }}"
          $gitver       = "${{ steps.version.outputs.gitver }}"
          $nsisversion  = "${{ steps.version.outputs.nsisversion }}"
          $nsisbinary   = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

          & $nsisbinary /NOCD `
            /DVERSION=$nsisversion `
            /DGITVERSION=$gitver `
            /DINPUTDIR=$releasedir `
            /DSOURCELOCATION=$sourcedir `
            /DOUTPUTDIR=$packagedir `
            "$sourcedir\gtk-v2\win32\client.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }

          pushd $packagedir
          & "$env:MSYS2_DIR\usr\bin\sha256sum.exe" "CrossfireClient-git-$gitver.exe" `
            > "$packagedir\CrossfireClient-git-$gitver.sha256"
          popd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crossfire-client-windows-${{ steps.version.outputs.gitver }}
          path: |
            ${{ github.workspace }}\package\*.zip
            ${{ github.workspace }}\package\*.exe
            ${{ github.workspace }}\package\*.sha256
          if-no-files-found: error
